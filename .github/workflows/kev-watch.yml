name: KEV Watch update

on:
  schedule:
    # 20 minutos después de cada pasada de kev-digest, que corre a en punto
    # cada 3 h. Antes esto descargaba el catálogo de CISA por su cuenta una vez
    # al día; ahora consume la salida ya procesada de kev-digest, que es la
    # única fuente de verdad.
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # necesario para disparar el workflow de deploy

concurrency:
  group: kev-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA: un tag se puede mover, y esto escribe en el repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Descargar los datos de kev-digest
        env:
          ORIGEN: https://raw.githubusercontent.com/eduolihez/kev-digest/main/data/latest.json
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/kev.json "$ORIGEN"

          # Nunca sobreescribir con basura: si la descarga viene a medias o el
          # formato cambia al otro lado, es preferible fallar aquí y quedarnos
          # con los datos de ayer que publicar una pagina rota.
          jq -e '
            (.recentAdditions | type == "array")
            and (.totalTracked | type == "number") and (.totalTracked > 0)
            and (.lastUpdated | type == "string")
          ' /tmp/kev.json > /dev/null

          mv /tmp/kev.json src/data/kev.json
          echo "Descargado: $(jq -r '.totalTracked' src/data/kev.json) CVEs en seguimiento, $(jq -r '.recentAdditions | length' src/data/kev.json) recientes"

      - name: Commit y push si ha cambiado
        id: commit
        run: |
          git config user.name "kev-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/kev.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOTAL=$(jq -r '.totalTracked' src/data/kev.json)
          NUEVAS=$(jq -r '.newToday' src/data/kev.json)
          git commit -m "kev-watch: ${NUEVAS} nuevas hoy (${TOTAL} en seguimiento)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar la reconstrucción del sitio
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
