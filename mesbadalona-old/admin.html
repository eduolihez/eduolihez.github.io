<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="nav_admin">Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <link rel="stylesheet" href="assets/css/style.css"> 
    <link rel="stylesheet" href="assets/css/admin.css"> 
    <style>
        /* Estilos en línea temporales para la carga rápida */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; display: flex; align-items: center; justify-content: center; 
            z-index: 9999; font-size: 20px; color: var(--primary);
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <i class="ri-loader-4-line ri-spin"></i> Carregant...
    </div>

    <div id="admin-login" class="page-content hidden">
        <h1 class="text-center" style="margin-top: 50px;"><i class="ri-lock-2-line"></i> Accés Administració</h1>
        <form id="adminLoginForm" class="form-container">
            <label for="username">Usuari (Email):</label>
            <input type="email" id="username" name="usuario" required class="modern-input">

            <label for="password">Contrasenya:</label>
            <input type="password" id="password" name="password" required class="modern-input">

            <button type="submit" class="btn-submit-main" style="width: 100%; margin-top: 20px;">Entrar</button>
            <p id="loginMessage" class="text-center" style="color: var(--danger); margin-top: 10px;"></p>
        </form>
        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="back-link"><i class="ri-arrow-left-line"></i> Tornar al mapa</a>
        </div>
    </div>

    <div id="admin-dashboard" class="admin-layout hidden">
        
        <nav id="admin-sidebar" class="admin-sidebar">
            <div class="sidebar-header"><i class="ri-lightbulb-flash-line"></i> Més Badalona</div>

            <div class="sidebar-nav" id="admin-tabs">
                <button class="admin-tab-btn" data-tab="incidents" id="tab-incidents-btn" onclick="app.setActiveAdminTab('incidents')"><i class="ri-list-settings-line"></i> <span data-i18n="admin_tab_incidents">Incidències</span></button>
                <button class="admin-tab-btn" data-tab="map" id="tab-map-btn" onclick="app.setActiveAdminTab('map')"><i class="ri-map-2-line"></i> <span data-i18n="admin_tab_map">Mapa</span></button>
                <button class="admin-tab-btn" data-tab="stats" id="tab-stats-btn" onclick="app.setActiveAdminTab('stats')"><i class="ri-line-chart-line"></i> <span data-i18n="admin_tab_stats">Dashboard</span></button>
                <button class="admin-tab-btn" data-tab="users" id="tab-users-btn" onclick="app.setActiveAdminTab('users')"><i class="ri-group-line"></i> <span data-i18n="admin_tab_users">Usuaris</span></button>
            </div>

            <div class="sidebar-user">
                <p id="admin-user-display-pc" class="text-muted" style="margin-bottom: 10px;"></p>
                <button id="logoutBtnPc" class="btn-logout" onclick="app.handleAdminLogout()" style="width: 100%;">
                    <i class="ri-logout-box-r-line"></i> <span data-i18n="admin_logout">Sortir</span>
                </button>
            </div>
        </nav>

        <div id="main-content-area" class="main-content-area">
            
            <nav class="top-bar admin-top-bar">
                <div class="brand admin-title"><i class="ri-lightbulb-flash-line"></i> Admin Panel</div>
                <div style="display:flex; align-items:center; gap: 15px;">
                    <span id="admin-user-display-mobile" class="text-muted" style="font-weight: 600;"></span>
                    <button id="logoutBtnMobile" class="btn-logout btn-sm" onclick="app.handleAdminLogout()"><i class="ri-logout-box-r-line"></i></button>
                </div>
            </nav>
            
            <div class="admin-tabs-mobile" id="admin-tabs-mobile-nav">
                </div>

            <div class="admin-content-wrapper page-content">
                
                <header class="admin-header">
                    <h1 class="admin-title" id="current-tab-title"></h1>
                    </header>

                <div id="tab-incidents-content" class="admin-tab-content">
                    <div class="filter-bar-admin">
                        <select id="filter-status" onchange="app.loadAdminData()">
                            <option value="all" data-i18n="admin_list_all">Tots els Estats</option>
                            <option value="pendiente" data-i18n="status_pendiente">Pendents</option>
                            <option value="proceso" data-i18n="status_proceso">En Procés</option>
                            <option value="resuelto" data-i18n="status_resuelto">Solucionats</option>
                        </select>
                        <select id="filter-category" onchange="app.loadAdminData()">
                            <option value="all">Totes les Categories</option>
                            <option value="infraestructura" data-i18n="cat_infra">Infraestructura</option>
                            <option value="denuncia" data-i18n="cat_denuncia">Denúncia</option>
                        </select>
                        <select id="filter-barri-admin" onchange="app.loadAdminData()">
                            <option value="all" data-i18n="filter_barri_all">Tots els Barris</option>
                        </select>
                        <input type="text" id="filter-search" data-i18n="filter_search_ph" placeholder="Cercar Títol o Descripció..." oninput="app.loadAdminData()" style="max-width: none;">
                    </div>

                    <div id="incident-list" class="incident-list-admin">
                        <p id="list-message" class="text-center" style="padding: 20px; color: var(--text-light);" data-i18n="admin_list_loading">Carregant dades...</p>
                    </div>
                </div>
                
                <div id="tab-map-content" class="admin-tab-content hidden">
                    <div class="map-filter-panel">
                        <div class="map-filter-grid">
                            <select id="map-filter-status" onchange="app.updateAdminMapFilters()"></select>
                            <select id="map-filter-category" onchange="app.updateAdminMapFilters()"></select>
                            <select id="map-filter-urgency" onchange="app.updateAdminMapFilters()"></select>
                            <select id="map-filter-afectacion" onchange="app.updateAdminMapFilters()"></select>
                            <select id="map-filter-votos" onchange="app.updateAdminMapFilters()"></select>
                            <button class="btn-sm btn-primary" onclick="app.resetAdminMapFilters()"><i class="ri-filter-line"></i> Reiniciar Filtres</button>
                        </div>
                    </div>
                    <div id="map-admin"></div>
                </div>

                <div id="tab-stats-content" class="admin-tab-content hidden">
                    <p class="text-center" style="padding: 50px; color: var(--text-light);" data-i18n="admin_list_loading">Carregant dades...</p>
                </div>

                <div id="tab-users-content" class="admin-tab-content hidden">
                    <button id="createUserBtn" class="btn-sm btn-primary" onclick="app.openCreateAdminModal()" data-i18n="admin_btn_new_user" style="display:none; margin-bottom: 20px;">
                        <i class="ri-user-add-line"></i> Nou Usuari
                    </button>
                    <div id="admin-users-list"></div>
                </div>
                
            </div>
            
            <div id="detail-panel" class="detail-panel closed">
                <button class="close-icon-fixed" onclick="app.closeDetailPanel()" style="position: absolute; top: 15px; right: 20px;"><i class="ri-close-line"></i></button>
                <div id="detail-content" style="padding-top: 50px;"></div>
            </div>
        </div>
    </div>

    <div id="adminUserModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="adminModalTitle">Nou Usuari</h2>
            <form id="adminUserForm">
                <input type="hidden" id="adminUserId" name="id">

                <label for="adminUsername">Email (Usuari):</label>
                <input type="email" id="adminUsername" name="usuario" required class="modern-input">

                <label for="adminPassword" id="passwordLabel">Contrasenya (Mín. 8 caràcters):</label>
                <input type="password" id="adminPassword" name="password" required minlength="8" class="modern-input">

                <label for="adminRole">Rol:</label>
                <select id="adminRole" name="role" required class="modern-input"></select>

                <label for="adminAccessType">Accés per Tipus de Categoria:</label>
                <select id="adminAccessType" name="access_type" required class="modern-input"></select>
                
                <div id="districtAccessContainer" class="hidden">
                    <label for="adminDistrictAccess">Accés per Districtes (Separats per ',')</label>
                    <input type="text" id="adminDistrictAccess" name="district_access" placeholder="Ex: 1, 3, 6 (o 'all' per a tots)" class="modern-input">
                </div>

                <p id="userMessage" class="text-center" style="color: var(--danger); margin-top: 10px;"></p>

                <div class="modal-actions">
                    <button type="button" class="btn-sm btn-cancel" onclick="app.closeAdminUserModal()">Cancel·lar</button>
                    <button type="submit" id="adminSubmitBtn" class="btn-sm btn-primary">Crear Usuari</button>
                </div>
            </form>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="assets/js/app.js"></script> 
    <script src="assets/js/admin.js"></script> 
</body>
</html>
