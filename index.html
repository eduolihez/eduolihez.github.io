<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduardo Olivares | Terminal Portfolio</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="main-layout"> 
        <div id="terminal"> 
            <div id="output"></div> 
            <div id="input-line">
                <span id="prompt"></span> 
                <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
        
        <div id="sidebar">
            </div>
    </div>
    
    <audio id="sound-key" src="audio/keypress.mp3" preload="auto"></audio>
    <audio id="sound-success" src="audio/success.mp3" preload="auto"></audio>
    <audio id="sound-error" src="audio/error.mp3" preload="auto"></audio>

    <div id="disclaimer-modal-overlay" class="hidden">
        <div id="disclaimer-modal">
            <h2 id="modal-title"></h2>
            <div id="modal-content"></div>
            <div id="modal-buttons">
                <button id="visit-official"></button>
                <button id="close-modal" class="secondary-button"></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
