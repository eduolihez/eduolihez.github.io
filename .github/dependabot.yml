version: 2

updates:
  # GitHub Actions (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    # Menor/parche agrupados: casi nunca rompen nada. Los "major" llegan
    # en su propio PR para revisión manual.
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"
